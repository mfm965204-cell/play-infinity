name: Build Play Infinity APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate signing key
        run: |
          set -euo pipefail
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/ci.jks \
            -storepass playinfinity -keypass playinfinity \
            -alias playinfinity -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Play Infinity, OU=Mobile, O=Play Infinity, L=Mumbai, C=IN"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Show output
        run: ls -la app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: play-infinity-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
